[project]
name = "equityladder"
version = "0.2.0"
description = "Dependency-free math for a price-step equity ladder: whole-share buy/sell pairs around an execution anchor, average-cost accounting that separates adoption from profit."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Michael Anderson" }]
keywords = ["trading", "equity", "ladder", "grid", "rebalancing", "cost-basis", "decimal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
# Core is intentionally dependency-free: stdlib + Decimal only.
dependencies = []

[project.urls]
Homepage = "https://github.com/endthestart/equityladder"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/equityladder"]

[tool.ruff]
# Carried deliberately so the package lints identically inside a workspace and as
# a standalone repo.
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = [
    # Decimal('100') -> Decimal(100). Rejected on purpose: "the argument to Decimal is
    # always a string" is a bright line a reviewer can check by eye, and it makes
    # Decimal(0.30) -- a binary float bound to money -- impossible to write by habit.
    "FURB157",
    # dict(a=1) over {'a': 1} is used where the keys are keyword-ish; harmless.
    "C408",
]

[tool.ruff.lint.isort]
known-first-party = ["equityladder"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]
"examples/**" = ["T201"]
